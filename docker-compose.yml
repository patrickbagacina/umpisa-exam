services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lostfound
      MYSQL_USER: lostfound
      MYSQL_PASSWORD: lostfound
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP (not the socket) so the temporary server MySQL runs during first-time init doesn't count as ready.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ulostfound', '-plostfound']
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  db-data:
